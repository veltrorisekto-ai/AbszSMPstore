name: AbszSMP Store CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check frontend syntax
        run: |
          node --check app.js
          node --check admin-upgrades.js
      - name: Check API syntax
        run: |
          node --check api/_lib.js
          node --check api/store.js
          node --check api/order.js
          node --check api/admin.js
          node --check api/discord.js
          node --check api/bridge.js
